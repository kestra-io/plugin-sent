id: sent_signed_events
namespace: io.kestra.plugin.sent

tasks:
  - id: log_verified_event
    type: io.kestra.plugin.core.log.Log
    message: "Verified Sent event {{ trigger.event }}"

triggers:
  - id: sent_webhook
    type: io.kestra.plugin.sent.triggers.EventTrigger
    key: "{{ secret('SENT_WEBHOOK_URL_KEY') }}"
    signingSecret: "{{ secret('SENT_WEBHOOK_SIGNING_SECRET') }}"
    events:
      - message.received
